<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        body { background-color: #ffeef2; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; font-family: 'Arial', sans-serif; }
        .rosa { font-size: 80px; animation: flotar 3s infinite ease-in-out; }
        h1 { color: #d63384; text-align: center; }
        @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>
<body>
    <div class="rosa">🌹</div>
    <h1>Para Saray, espero que tu día sea tan especial como tú.</h1>
</body>
</html>
