<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: #fff0f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            flex-direction: column; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0;
            text-align: center;
        }
        .rosa { 
            font-size: 80px; 
            animation: flotar 3s infinite ease-in-out; 
            margin-bottom: 20px;
        }
        h1 { 
            color: #d81b60; 
            padding: 0 20px;
            font-size: 1.5rem;
        }
        @keyframes flotar { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-20px); } 
        }
    </style>
</head>
<body>
    <div class="rosa">🌹</div>
    <h1>Juliana, espero que tu día sea tan especial como tú.</h1>
</body>
</html>
