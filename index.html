<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: #fff0f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            flex-direction: column; 
            font-family: 'Arial', sans-serif; 
            margin: 0;
        }
        .ramo { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            max-width: 300px;
            gap: 10px;
            margin-bottom: 30px;
        }
        .rosa { 
            font-size: 50px; 
            animation: flotar 3s infinite ease-in-out; 
        }
        h1 { 
            color: #d81b60; 
            font-size: 1.6rem; 
            text-align: center;
            padding: 0 20px;
        }
        @keyframes flotar { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-15px); } 
        }
    </style>
</head>
<body>
    <div class="ramo">
        <div class="rosa">🌹</div>
        <div class="rosa">🌹</div>
        <div class="rosa">🌹</div>
        <div class="rosa">🌹</div>
        <div class="rosa">🌹</div>
    </div>
    <h1>Para Juliana, este pequeño detalle de flores para alegrar tu día.</h1>
</body>
</html>
